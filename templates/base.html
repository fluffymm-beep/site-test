<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}گالری پرامپت{% endblock %}</title>
    <style>
        :root {
            color-scheme: dark;
            --midnight-blue: #0A192F;
            --graphite: #263238;
            --neon-cyan: #00FFF7;
            --silver-gray: #B0BEC5;
            --white-smoke: #ECEFF1;
            --card-bg: rgba(236, 239, 241, 0.08);
            --border-color: rgba(176, 190, 197, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Vazirmatn", "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(0, 255, 247, 0.12), transparent 35%),
                        radial-gradient(circle at 90% 10%, rgba(236, 239, 241, 0.08), transparent 40%),
                        linear-gradient(135deg, var(--midnight-blue), var(--graphite));
            color: var(--white-smoke);
            display: flex;
            justify-content: center;
        }

        .container {
            width: min(1100px, 100%);
            padding: 3.5rem 1.8rem 4.5rem;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .glass {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            box-shadow: 0 22px 45px rgba(10, 25, 47, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            font-size: 0.95rem;
            color: rgba(236, 239, 241, 0.6);
        }

        @media (max-width: 600px) {
            .container {
                padding: 2.5rem 1.1rem 3rem;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
        <footer>
            ساخته شده با جنگو برای نمایش ایده‌های پرامپت
        </footer>
    </div>
</body>
</html>
